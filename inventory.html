<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicles | Pragathi Lanka</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="inventory">

<div class="page-head">
  <div class="wrap">
    <h1>Our vehicles</h1>
    <p>Pick a make to narrow the list. Found one you like? Tap "Ask about this car" and we'll reply on WhatsApp.</p>
  </div>
</div>

<section>
  <div class="wrap">
    <div class="chips" role="group" aria-label="Filter by make"></div>
    <p id="count" class="note" aria-live="polite" style="margin:-10px 0 20px"></p>
    <div class="grid" data-cars></div>
    <p class="note">These are sample listings. Photos and real stock will replace them.</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
